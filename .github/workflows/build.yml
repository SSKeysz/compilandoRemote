name: Build EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

env:
  NOME_EXE: RotaControl

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Listar arquivos
        run: dir

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flask pillow mss pycaw comtypes pyinstaller

      - name: Checar se compila
        run: python -m py_compile painel.py
        

      - name: Compilar exe
        run: pyinstaller --onefile --noconsole --clean --name $env:NOME_EXE --icon=NONE --collect-all pycaw --collect-all comtypes --collect-all PIL --collect-all mss painel.py

      - name: Listar arquivos gerados
        run: dir dist

      - name: Enviar exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME_EXE }}-exe
          path: dist/${{ env.NOME_EXE }}.exe
