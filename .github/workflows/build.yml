name: Build EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

env:
  NOME_EXE: RotaControl

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar HWiNFO64 portable
        shell: pwsh
        run: |
          # Instala via chocolatey (sempre pega a última versão)
          choco install hwinfo --yes --no-progress

          # Procura o HWiNFO64.exe instalado
          $caminhos = @(
            "C:\Program Files\HWiNFO64\HWiNFO64.exe",
            "C:\Program Files (x86)\HWiNFO64\HWiNFO64.exe"
          )
          $exe = $null
          foreach ($p in $caminhos) {
            if (Test-Path $p) { $exe = $p; break }
          }
          if (-not $exe) {
            $achado = Get-ChildItem -Path "C:\Program Files" -Recurse -Filter "HWiNFO64.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($achado) { $exe = $achado.FullName }
          }
          if (-not $exe) {
            Write-Error "HWiNFO64.exe nao encontrado"
            exit 1
          }

          # Copia pra raiz do projeto com nome minúsculo
          Copy-Item $exe "hwinfo64.exe"
          Write-Host "OK, copiado de: $exe"

      - name: Criar HWiNFO64.INI padrao
        shell: pwsh
        run: |
          # INI mínimo com as configs boas pra rodar em background
          $ini = @"
[Settings]
MinimizeMainWndOnStartup=1
MinimizeSensorsOnStartup=1
SharedMemorySupport=1
SensorsOnly=1
AutoStart=1
CloseOnExit=1
"@
          $ini | Out-File -FilePath "HWiNFO64.INI" -Encoding ASCII
          Get-Content "HWiNFO64.INI"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install flask pillow mss pycaw comtypes psutil "qrcode[pil]" winsdk requests sensorwatch pyinstaller

      - name: Checar se compila
        run: python -m py_compile painel.py

      - name: Compilar exe
        run: |
          pyinstaller --onefile --noconsole --clean --name $env:NOME_EXE --icon=NONE `
            --collect-all pycaw --collect-all comtypes --collect-all PIL `
            --collect-all mss --collect-all psutil --collect-all qrcode `
            --collect-all winsdk --collect-all sensorwatch `
            --add-data "hwinfo64.exe;." `
            --add-data "HWiNFO64.INI;." `
            painel.py

      - name: Listar arquivos gerados
        run: dir dist

      - name: Enviar exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME_EXE }}-exe
          path: dist/${{ env.NOME_EXE }}.exe
